<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Carlos Reyes — Software Developer</title>
  <desc id="desc">Clean premium animated tech header in cyan for a GitHub profile.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050D15"/>
      <stop offset="50%" stop-color="#06101A"/>
      <stop offset="100%" stop-color="#04111B"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5FAFF"/>
      <stop offset="55%" stop-color="#DDE6F0"/>
      <stop offset="100%" stop-color="#A8B4C3"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2BBAC5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2BBAC5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2BBAC5" stop-opacity="0"/>
    </linearGradient>

    <filter id="nameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.17
                0 0 0 0 0.73
                0 0 0 0 0.77
                0 0 0 0.32 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="1196" height="276" rx="18" fill="url(#bg)" stroke="#2BBAC5" stroke-opacity="0.12"/>

  <g stroke="#2BBAC5" stroke-width="2" fill="none" opacity="0.9">
    <path d="M40 54 V34 H60"/>
    <path d="M1140 34 H1160 V54"/>
    <path d="M40 226 V246 H60"/>
    <path d="M1140 246 H1160 V226"/>
  </g>

  <g opacity="0.95">
    <line x1="86" y1="58" x2="86" y2="222" stroke="#2BBAC5" stroke-opacity="0.22"/>
    <line x1="102" y1="78" x2="130" y2="78" stroke="#2BBAC5" stroke-width="2" stroke-opacity="0.95"/>
    <line x1="102" y1="200" x2="130" y2="200" stroke="#2BBAC5" stroke-width="2" stroke-opacity="0.75"/>
    <g transform="translate(90 140)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="30" fill="#071019" stroke="#2BBAC5" stroke-opacity="0.8"/>
      <text x="0" y="8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="700" fill="#2BBAC5">&lt;/&gt;</text>
    </g>
  </g>

  <g text-anchor="middle">
    <text x="600" y="92" font-family="Arial Black, Impact, Haettenschweiler, 'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5" fill="url(#nameFill)" filter="url(#nameGlow)">Carlos Reyes</text>

    <text x="600" y="132" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#F2F6FA">SOFTWARE DEVELOPER</text>

    <rect x="815" y="116" width="6" height="18" rx="1" fill="#2BBAC5">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="164" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#E0E8EF">Building modern web applications, automation tools and production-ready systems.</text>

    <g transform="translate(600 205)">
      <rect x="-316" y="-20" width="632" height="40" rx="8" fill="#07121B" stroke="#2BBAC5" stroke-opacity="0.5"/>
      <text x="0" y="6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="650" letter-spacing="0.7" fill="#F2F6FA">WEB APPLICATIONS<tspan fill="#2BBAC5">  •  </tspan>AUTOMATION<tspan fill="#2BBAC5">  •  </tspan>INFRASTRUCTURE</text>
    </g>

    <text x="600" y="244" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" letter-spacing="0.5" fill="#9AA7B3">Clean systems • modern web development • mission-focused execution</text>
  </g>

  <rect x="420" y="248" width="360" height="2" rx="1" fill="url(#accentLine)" opacity="0.9" filter="url(#softGlow)">
    <animate attributeName="x" values="405;435;405" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.9;0.45" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
